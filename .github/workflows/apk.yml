name: Construir app Android

on:
  workflow_dispatch:   # se ejecuta a mano desde la pestaña Actions

permissions:
  contents: write      # para publicar el APK en la sección Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Construir la app
        working-directory: android
        run: gradle assembleDebug -PPAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk publicador.apk
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android publicador.apk --title "App Android" --notes "App del publicador para Android. Descarga publicador.apk e instálala desde el teléfono."
