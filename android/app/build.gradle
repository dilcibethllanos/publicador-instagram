plugins {
    id 'com.android.application'
}

android {
    namespace 'com.publicador.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.publicador.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // La dirección de la página se pasa al compilar (-PPAGE_URL=...)
        buildConfigField 'String', 'PAGE_URL', "\"${project.findProperty('PAGE_URL') ?: 'https://example.com/'}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
