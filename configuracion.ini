[publicacion]
# Horas de publicación cada día, en formato 24 h y separadas por comas
horarios = 10:00, 18:00

# alfabetico = sigue el orden de los nombres de archivo | aleatorio = al azar
orden = alfabetico

# Caption (encabezado) que se usa para todos los videos de la carpeta "videos"
caption = Escribe aquí tu caption 🎬 #hashtag1 #hashtag2

# Si quieres un caption distinto para un video en particular, pon junto a él
# un archivo de texto con el mismo nombre (video1.mp4 -> video1.txt).


# --- OPCIONAL: usar solo ciertas subcarpetas de "videos" -------------------
# Si prefieres separar por subcarpetas, quita el # de las líneas de abajo.
# Entonces solo se usan las subcarpetas listadas (cada una con su caption)
# y el "caption" de arriba deja de usarse.
#
# alternar_carpetas = si     (si = rota entre carpetas | no = termina una y sigue)
#
# [carpetas]
# campana1 = Caption de la campaña 1 🎬 #emprendimiento
# recetas = Caption de recetas 🍳 #recetas
